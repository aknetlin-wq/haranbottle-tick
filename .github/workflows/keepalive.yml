# 깃허브는 저장소에 60일 동안 변화가 없으면 예약 실행을 멈춤 → 한 달에 한 번 빈 기록을 남겨 계속 돌게 함
name: keepalive
on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%FT%TZ > last_keepalive.txt
          git config user.name "haran-tick"
          git config user.email "actions@users.noreply.github.com"
          git add last_keepalive.txt
          git commit -m "keepalive" && git push
